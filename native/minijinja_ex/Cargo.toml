[package]
name = "minijinja_ex"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Elixir NIF for minijinja template engine"

[lib]
name = "minijinja_ex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.35"
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
chrono = "0.4"
serde = "1"
serde_json = "1"